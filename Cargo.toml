[workspace]
members = ["crates/mackani-format", "crates/mackani-ref", "crates/mackani-engine", "crates/mackani-text", "crates/mackani-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TKY-27/Mackani"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
mackani-format = { path = "crates/mackani-format" }

# Debug builds keep assertions and overflow checks but are optimized:
# the scalar reference is too slow to test otherwise.
[profile.dev]
opt-level = 2
